name: Phase 8 verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-matrix:
    name: Full simulation release matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      DATABASE_URL: postgresql://blckforest:blckforest@127.0.0.1:5432/blckforest?schema=public
      PHASE8_DATABASE_ADMIN_URL: postgresql://blckforest:blckforest@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      AUTH_DEV_BYPASS: "true"
      DEV_EMAIL_PREVIEW: "true"
      ALLOW_UNVERIFIED_WITHDRAWALS: "true"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET_PREFIX: blckforest-kyc
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      KYC_SCANNER: stub
      BASE_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      WS_URL: ws://127.0.0.1:3000/ws
      E2E_DEMO_EMAIL: dev@blckforest.local
      E2E_ADMIN_EMAIL: admin@blckforest.local
      PHASE8_START_SERVER: "true"
      PHASE8_FAIL_FAST: "true"
      E2E_START_SERVER: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "SECURITY_HASH_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          DEMO_PASSWORD="Demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa9!"
          ADMIN_PASSWORD="Admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa9!"
          echo "SEED_DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Install application dependencies
        run: npm ci

      - name: Start PostgreSQL, Redis, and MinIO
        run: |
          docker compose up -d postgres redis minio minio-init
          docker compose ps
          docker compose wait minio-init

      - name: Wait for infrastructure
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..60}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U blckforest \
              && docker compose exec -T redis redis-cli ping | grep -q PONG \
              && curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color postgres redis minio minio-init
          exit 1

      - name: Generate Prisma client and prepare database
        run: |
          npm run db:generate
          npm run db:deploy
          npm run db:seed
          npm run auth:doctor

      - name: Install browser verification tooling
        run: |
          npm --prefix e2e install
          npm --prefix e2e run install:browsers

      - name: Run Phase 8 full matrix
        run: npm run phase8:verify:full

      - name: Capture infrastructure logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/phase8
          docker compose ps > artifacts/phase8/docker-compose-ps.txt || true
          docker compose logs --no-color postgres redis minio minio-init > artifacts/phase8/infrastructure.log 2>&1 || true

      - name: Upload Phase 8 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase8-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/phase8
          if-no-files-found: error
          retention-days: 30

      - name: Stop infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans
