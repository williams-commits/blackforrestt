name: blckforest

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      # Optional: authenticated application subdomain (e.g. trade.blackforrestt.com).
      # When empty, Caddy runs in single-domain mode (backward compatible).
      TRADE_DOMAIN: ${TRADE_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blckforest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blckforest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blckforest} -d ${POSTGRES_DB:-blckforest}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      for bucket in quarantine sealed payment-quarantine payment-sealed; do
        mc mb --ignore-existing local/$${S3_BUCKET_PREFIX}-$${bucket};
        mc anonymous set none local/$${S3_BUCKET_PREFIX}-$${bucket} || true;
        mc encrypt set sse-s3 local/$${S3_BUCKET_PREFIX}-$${bucket} || true;
      done"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX:-blckforest-kyc}
    restart: "no"
    networks: [backend]

  app:
    image: ${APP_IMAGE:-blckforest-app:latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_TRADE_ORIGIN: ${NEXT_PUBLIC_TRADE_ORIGIN:-}
    init: true
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      AUTH_TRUST_HOST: "true"
      DEV_EMAIL_PREVIEW: "false"
      ALLOW_LOCAL_STUB_SCANNER: "false"
      RECONCILIATION_ENABLED: "true"
      FINNHUB_CANDLE_MODE: ${FINNHUB_CANDLE_MODE:-disabled}
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    security_opt: ["no-new-privileges:true"]
    networks: [backend, egress]

networks:
  edge:
  egress:
  backend:
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
