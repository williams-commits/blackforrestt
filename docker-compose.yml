# Local DEVELOPMENT infrastructure for all three apps (apps/web, apps/trade, apps/crm).
# Start it with:  docker compose up -d postgres redis minio minio-init
# The applications themselves run on the host (`make dev`, or `npm run dev` per app).
# The production stack is deploy/docker-compose.prod.yml — see docs/DEPLOYMENT.md.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blackforrestt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackforrestt}
      POSTGRES_DB: blackforrestt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackforrestt -d blackforrestt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the quarantine and sealed KYC buckets on first boot and,
  # where the provider supports it, enables default bucket encryption. Uploads
  # and downloads are proxied through the app (same-origin), so no browser CORS
  # configuration is required.
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET_PREFIX:-blckforest-kyc}-quarantine &&
      mc mb --ignore-existing local/${S3_BUCKET_PREFIX:-blckforest-kyc}-sealed &&
      mc mb --ignore-existing local/${S3_BUCKET_PREFIX:-blckforest-kyc}-payment-quarantine &&
      mc mb --ignore-existing local/${S3_BUCKET_PREFIX:-blckforest-kyc}-payment-sealed &&
      (mc anonymous set none local/${S3_BUCKET_PREFIX:-blckforest-kyc}-quarantine || true) &&
      (mc anonymous set none local/${S3_BUCKET_PREFIX:-blckforest-kyc}-sealed || true) &&
      (mc anonymous set none local/${S3_BUCKET_PREFIX:-blckforest-kyc}-payment-quarantine || true) &&
      (mc anonymous set none local/${S3_BUCKET_PREFIX:-blckforest-kyc}-payment-sealed || true) &&
      (mc encrypt set sse-s3 local/${S3_BUCKET_PREFIX:-blckforest-kyc}-sealed || true) &&
      (mc encrypt set sse-s3 local/${S3_BUCKET_PREFIX:-blckforest-kyc}-quarantine || true) &&
      (mc encrypt set sse-s3 local/${S3_BUCKET_PREFIX:-blckforest-kyc}-payment-sealed || true) &&
      (mc encrypt set sse-s3 local/${S3_BUCKET_PREFIX:-blckforest-kyc}-payment-quarantine || true)
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
